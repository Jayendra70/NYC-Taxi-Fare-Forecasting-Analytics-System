name: tests

on:
  push:
  pull_request:

jobs:
  inference-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/ml-inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: service/ml-inference/requirements*.txt
      - name: Install the service and test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests (a small stand-in model replaces the real one)
        run: pytest -q
